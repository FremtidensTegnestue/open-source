<text x="20" y="389" font-family="Helvetica,Arial,sans-serif" font-size="2.9986" font-weight="700" text-anchor="start" fill="#252823">DET VISER PRØVEN ENDNU IKKE</text>
<text x="20" y="396" font-family="Helvetica,Arial,sans-serif" font-size="3.1750" font-weight="400" text-anchor="start" fill="#6D746B">Isolering, membraner, inddækninger og fastgørelsesdetaljer er ikke med i dette modeludsnit.</text>
<text x="20" y="402" font-family="Helvetica,Arial,sans-serif" font-size="3.1750" font-weight="400" text-anchor="start" fill="#6D746B">Åbninger og samlinger skal eftervises særskilt. Grafisk prøve - ikke til udførelse.</text>
