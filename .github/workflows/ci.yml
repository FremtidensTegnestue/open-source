name: Material data and CLI checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: materialer

jobs:
  browser-materials:
    name: Browser material lookup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install pyarrow==26.0.1
      - name: Verify the source-bound browser export
        run: python scripts/build_browser_materials.py --check
      - name: Verify the separate source-bound screw export
        run: python scripts/build_browser_fasteners.py --check
      - name: Verify source-bound browser reading pages
        run: python scripts/build_browser_guides.py --check
      - name: Check every exported observation and source context
        run: python -m unittest discover -s tests -p 'test_browser_*.py' -v
      - name: Check search, unit labels, missing values and invalid editions
        run: node --test ../docs/core.test.mjs

  public-docs:
    name: Public reading paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check public Markdown and HTML references
        run: python scripts/check_public_docs.py
      - name: Check link-checker regressions
        run: python -m unittest discover -s tests -p test_public_docs.py -v

  first-lookup:
    name: First material lookup (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only the beginner dependency
        run: python -m pip install pyarrow==26.0.1
      - name: Check shipped data, real lookups and error messages without a database
        run: python -m unittest discover -s tests -p test_opslag_parquet.py -v

  verify:
    name: Historical v0.1 compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: materialer/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Restore the complete dataset
        run: python scripts/build_database.py
      - name: Check database integrity
        run: python materials.py verify --database-only
      - name: Run Python tests
        run: python -m unittest discover -s tests -v
      - name: Calculate the source-bound example
        run: |
          python materials.py calculate examples/requests/environmental-1000kg.json --out output/check.json
          python -c 'import json; r=json.load(open("output/check.json")); assert abs(r["value"]-429.5)<1e-9'

  rust:
    name: Rust CLI and public data edition
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '3'
    steps:
      - uses: actions/checkout@v4
      - name: Install the Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal && rustup override set 1.95.0
      - name: Test the native CLI
        run: |
          cargo test --locked --release
          cargo test --locked --release --example hyldekonsol
      - name: Build and check the public data edition
        run: |
          cargo build --locked --release --bin ft-materials
          target/release/ft-materials collect-field-sources
          target/release/ft-materials collect-heating
          git diff --exit-code -- data/supplements/field-sources data/supplements/ens-varme
          target/release/ft-materials build --expect "$(jq -r '.editions.public.snapshot' data/releases/mechanics-2026-11-20.json)"
          target/release/ft-materials fields | jq -e '.count == 169'
          target/release/ft-materials coverage > /tmp/ft-coverage.json
          diff -u data/releases/coverage-public-mechanics-2026-11-20.json /tmp/ft-coverage.json
          target/release/ft-materials verify
          target/release/ft-materials calculate examples/requests/environmental-1000kg.json | jq -e '.value == 429.5'
      - name: Check both window examples against the public edition
        run: |
          for name in existing-window new-build-window; do
            request="examples/disassembly/$name.json"
            report="$RUNNER_TEMP/$name.json"
            status=0
            target/release/ft-materials disassembly "$request" > "$report" || status=$?
            test "$status" -eq 2
            jq -e '.status == "partial" and .winner == null and all(.variants[]; .complete_lifecycle_total == null)' "$report"
            target/release/ft-materials disassembly "$request" --check "$report" | jq -e '.current'
          done
          jq -e '.variants[] | select(.id == "repair") | .products.known_totals_by_module["A1-A3"] | ((. - 0.36471079) | fabs) < 0.000001' "$RUNNER_TEMP/existing-window.json"
          jq -e '(.variants | map(.proposed_actions.beads)) == ["temporarily_remove", "replace"] and all(.variants[]; (.products.known_totals_by_module["A1-A3"] - 71.43004994 | fabs) < 0.000001)' "$RUNNER_TEMP/new-build-window.json"
      - name: Package tested Linux x86-64 binary
        run: tar -C target/release -czf ft-materials-linux-x86_64.tar.gz ft-materials
      - uses: actions/upload-artifact@v4
        with:
          name: ft-materials-linux-x86_64
          path: materialer/ft-materials-linux-x86_64.tar.gz
          retention-days: 3
